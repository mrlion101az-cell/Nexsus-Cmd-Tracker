name: NexusCmdTracker
version: '${project.version}'
main: com.nexusuniverse.cmdtracker.NexusCmdTrackerPlugin
api-version: '1.21'
author: NexusUniverse
description: Scans your world for command blocks and lets you browse, filter, and teleport to them.

commands:
  cmdfinder:
    description: Find, browse, and teleport to command blocks.
    usage: /cmdfinder <scan|stop|status|rescan|gui|list|tp|remove>
    aliases: [cbf, cmdblockfinder]
    permission: nexuscmdtracker.admin

permissions:
  nexuscmdtracker.admin:
    description: Full access to NexusCmdTracker -- reveals command block locations and contents, so this stays op-only by default
    default: op
