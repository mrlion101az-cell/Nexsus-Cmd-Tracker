scan:
  # How many chunks to inspect per server tick during a full /cmdfinder scan.
  # Each chunk that isn't already loaded gets loaded from disk, checked for
  # command blocks, then unloaded again if nobody was already using it.
  # Higher = faster scan but more disk I/O per tick (can cause a stutter on
  # a live server with players on); lower = smoother but slower. 4 is a
  # reasonable middle ground for a server with players actively on it.
  chunks-per-tick: 4

  # How many chunks between progress updates sent to whoever started the scan.
  progress-message-interval: 500

storage:
  # How often the on-disk commandblocks.yml gets rewritten, in minutes --
  # only actually writes if something changed since the last save (new
  # command block found, one removed, etc.), so this is cheap to leave low.
  autosave-interval-minutes: 5
